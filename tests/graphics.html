<!doctype html><meta charset="utf-8"><title>Local graphics regression fixture</title><style>body{margin:0;background:#eee}canvas{display:block;width:100vw;height:90vh}p{font:14px sans-serif;padding:5px 20px}</style><canvas id="canvas" tabindex="0" aria-label="图形回归场景"></canvas><p id="result">Loading</p><script type="module">
import {buildWorld} from '../world/index.js';import {createWalk} from '../walk.js';
const q=new URLSearchParams(location.search),key=q.get('group')||'region',cases={region:[2,3,4,6,7],city:[9,10,16,18,20,21,22,28,29],neighborhood:[30,31,37,38,39,52,53,54,60,67,68],institution:[75,79,80,81,82,83,87,88,89,92,94],site:[104,105,106,110,112,115,119,120,125,126],plan:[127,128,129,136,137,138,139,143,147],edge:[159,160,161,163,166,167,168,171,173,174,176,177],room:[179,180,181,182,185,190,193,200,201],construction:[205,206,209,210,211,212,217,219,221,222,223,229,231,236,239],finish:[241,242,243,244,245,246,247,250,251,252,253]},ids=cases[key];
const canvas=document.getElementById('canvas'),result=document.getElementById('result');
try{const engine=createWalk(canvas,m=>result.textContent=m,()=>{result.textContent=key+' / '+canvas.dataset.shadowStorage;},null,{forcePacked:q.get('packed')==='1'});const scene=buildWorld(key,ids,{hour:q.get('night')?0:15});scene.cutaway=['plan','room'].includes(key);engine.update(scene,{freeMode:!q.get('walk')});if(q.get('focus'))engine.goToPattern(+q.get('focus'));engine.start();}catch(e){result.textContent='ERROR '+e.message;}
</script>
